<!DOCTYPE html>
<html>
<head><title>Ward Patients</title></head>
<body>
    <h1>Patients on the ward</h1>
    <ul>
        {% for patient in patients %}
            <li>
                <strong>{{ patient.name }}</strong> —
                age {{ patient.age }},
                diagnosis: {{ patient.diagnosis }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
